<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fronimus</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }

    .container {
      max-width: 700px;
      padding: 24px;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 12px;
    }

    p {
      font-size: 20px;
      color: #bbb;
      line-height: 1.5;
    }

    a {
      color: #7cc7ff;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .buttons {
      margin-top: 24px;
    }

    .buttons a {
      display: inline-block;
      margin: 8px;
      padding: 12px 18px;
      border: 1px solid #444;
      border-radius: 10px;
      background: #1b1b1b;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Fronimus</h1>
    <p>
      Voxel automation sandbox game in development.
    </p>
    <div class="buttons">
      <a href="#">Steam</a>
      <a href="#">Discord</a>
      <a href="#">Itch.io</a>
    </div>
  </div>
</body>
</html>
