<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fronimus</title>
<link rel="icon" type="image/png" sizes="32x32" href="./iconx32.png" />


<style>
@font-face {
  font-family: "LanaPixel";
  src: url("./fonts/LanaPixel.ttf");
  font-display: swap;
}

:root {
  --yellow: #FEB803;
  --bg: #0a0a0a;
  --text: #f3efe4;
  --muted: #b7af9c;
  --line: rgba(254,184,3,0.18);
  --line-strong: rgba(254,184,3,0.34);
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
  background: var(--bg);
}

body {
  margin: 0;
  font-family: "LanaPixel", sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow-x: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  opacity: 0.05;
  pointer-events: none;
  background:
    linear-gradient(transparent 95%, var(--yellow) 100%),
    linear-gradient(90deg, transparent 95%, var(--yellow) 100%);
  background-size: 40px 40px;
}

a {
  color: inherit;
  text-decoration: none;
}

.container {
  width: min(1240px, calc(100% - 40px));
  margin: 0 auto;
  padding: 26px 0 70px;
  position: relative;
  z-index: 1;
}

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  margin-bottom: 22px;
}

.logo {
  color: var(--yellow);
  font-size: 14px;
  letter-spacing: 0.06em;
}

.nav {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.nav a {
  padding: 10px 12px;
  color: var(--muted);
  border: 1px solid transparent;
}

.nav a:hover {
  border-color: var(--line);
  color: var(--text);
}

.hero {
  position: relative;
  min-height: 520px;
  width: 100%;
  border: 1px solid rgba(254,184,3,0.10);
  background: #050505;
  display: flex;
  align-items: end;
  padding: 28px;
  overflow: hidden;
  clip-path: inset(0);
  isolation: isolate;
}

.hero::before {
  content: "";
  position: absolute;
  inset: 0;
  background: url("./crafting_scene.jpg") center/cover no-repeat;
  z-index: -2;
  transform: scale(1.004);
}

.hero::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(rgba(0,0,0,0.16), rgba(0,0,0,0.58));
  z-index: -1;
  pointer-events: none;
}

.hero-copy {
  position: relative;
  z-index: 1;
  max-width: 650px;
}

.title {
  font-size: clamp(36px, 6vw, 78px);
  line-height: 0.9;
  margin: 0 0 12px;
}

.subtitle {
  color: var(--yellow);
  margin-bottom: 18px;
  font-size: 14px;
}

.description {
  color: var(--muted);
  line-height: 1.7;
  font-size: 14px;
  max-width: 60ch;
}

.buttons {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 24px;
}

.button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 48px;
  padding: 0 18px;
  border: 1px solid var(--line-strong);
  background: rgba(254,184,3,0.08);
  color: var(--yellow);
  transition: 0.18s ease;
}

.button:hover {
  background: var(--yellow);
  color: #111;
}

.section {
  margin-top: 20px;
}

.media-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
}

.media-item {
  position: relative;
  aspect-ratio: 16 / 9;
  width: 100%;
  border: 1px solid var(--line);
  background: #0d0d0d;
  overflow: hidden;
  clip-path: inset(0);
}

.media-item img,
.media-item iframe {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
  border: 0;
}

.media-item img {
  transform: scale(1.002);
}

.placeholder {
  height: 100%;
  display: grid;
  place-items: center;
  text-align: center;
  padding: 18px;
  color: var(--yellow);
  background:
    linear-gradient(rgba(254,184,3,0.04), rgba(254,184,3,0.02)),
    repeating-linear-gradient(135deg, rgba(254,184,3,0.05) 0 16px, transparent 16px 32px);
}

.placeholder span {
  color: var(--muted);
  display: block;
  margin-top: 8px;
  font-size: 12px;
  line-height: 1.6;
}

.footer {
  margin-top: 28px;
  color: #8e8570;
  font-size: 12px;
}

@media (max-width: 800px) {
  .container {
    width: min(100% - 24px, 1240px);
  }

  .hero {
    min-height: 420px;
    padding: 20px;
  }

  .media-grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>
<div class="container">
  <header class="topbar">
    <div class="logo">FRONIMUS</div>

    <nav class="nav">
      <a href="#media">Media</a>
      <a href="https://store.steampowered.com/app/4454060/Fronimus" target="_blank" rel="noreferrer">Steam</a>
      <a href="https://discord.gg/xHBE4kdpMK" target="_blank" rel="noreferrer">Discord</a>
    </nav>
  </header>

  <section class="hero">
    <div class="hero-copy">
      <h1 class="title">FRONIMUS</h1>
      <div class="subtitle">Voxel Automation Sandbox</div>

      <div class="description">
        Build machines, create production chains, and progress through industrial systems
        in a voxel world focused on automation, heat, and experimentation.
      </div>

      <div class="buttons">
        <a class="button" href="https://store.steampowered.com/app/4454060/Fronimus" target="_blank" rel="noreferrer">Wishlist on Steam</a>
        <a class="button" href="https://discord.gg/xHBE4kdpMK" target="_blank" rel="noreferrer">Join Discord</a>
      </div>
    </div>
  </section>

  <section class="section" id="media">
    <div class="media-grid">
      <div class="media-item">
        <img src="./screen2.jpg" alt="Fronimus screenshot" />
      </div>

      <div class="media-item">
        <img src="./conveyor.gif" alt="Fronimus conveyors" />
      </div>

      <div class="media-item">
        <img src="./screen3.jpg" alt="Fronimus screenshot" />
      </div>

      <div class="media-item">
        <iframe
          src="https://youtu.be/JurGIuYGTTs"
          title="Fronimus video"
          loading="lazy"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen>
        </iframe>
      </div>

      <div class="media-item">
        <img src="./screen4.png" alt="Fronimus screenshot" />
      </div>

      <div class="media-item">
        <img src="./ui_scene.jpg" alt="Fronimus screenshot" />
      </div>
    </div>
  </section>

  <div class="footer">
    © Fronimus
  </div>
</div>
</body>
</html>
